<!doctype html><html lang="it"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Anteprima scanner — fotocamera simulata</title></head><body><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {BookScanner} from '/src/BookScanner.tsx';
import '/src/style.css';
const c=document.createElement('canvas');c.width=1280;c.height=720;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,1280,720);g.addColorStop(0,'#626c58');g.addColorStop(1,'#293326');x.fillStyle=g;x.fillRect(0,0,1280,720);x.save();x.translate(640,360);x.rotate(-.06);x.fillStyle='#e1dac8';x.fillRect(-240,-310,480,620);x.fillStyle='#b7b398';x.fillRect(-240,-310,18,620);x.fillStyle='#ece8dc';x.fillRect(-135,-55,270,100);x.fillStyle='#3d4037';for(let i=0;i<40;i++)x.fillRect(-115+i*6,-38,i%3+1,61);x.font='15px monospace';x.fillText('ANTEPRIMA FOTOCAMERA',-106,90);x.restore();
setInterval(()=>{x.fillStyle='#626c58';x.fillRect(0,0,2,2);},180);
Object.defineProperty(navigator,'mediaDevices',{configurable:true,value:{getUserMedia:async()=>c.captureStream(3)}});

const isbn='9788834603000';
const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
const parity=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'][+isbn[0]];
const bits='101'+[...isbn.slice(1,7)].map((d,i)=>(parity[i]==='L'?L:G)[+d]).join('')+'01010'+[...isbn.slice(7)].map(d=>R[+d]).join('')+'101';
x.fillStyle='#fff';x.fillRect(510,295,260,130);x.fillStyle='#000';[...bits].forEach((bit,i)=>{if(bit==='1')x.fillRect(545+i*2,315,2,85);});
const realFetch=window.fetch.bind(window);
window.fetch=async(input,options)=>{const u=new URL(input instanceof Request?input.url:String(input),location.href);if(u.hostname!=='bookflix-scraper.riciriccio.workers.dev')return realFetch(input,options);
if(u.pathname==='/auth/check')return new Response(JSON.stringify({authenticated:true}));
if(u.pathname==='/cover')return new Response(await new Promise(resolve=>c.toBlob(resolve,'image/png')),{headers:{'Content-Type':'image/png'}});
if(u.pathname==='/lookup'){await new Promise(resolve=>setTimeout(resolve,8000));return new Response(JSON.stringify({candidates:u.searchParams.get('source')==='amazon'?[{source:'Amazon (sperimentale)',url:'https://www.amazon.it/dp/8834603001',isbn,data:{title:'Libro di prova scanner',subtitle:'Dati recuperati automaticamente',authors:['Autore di prova'],publisher:'Editore dimostrativo',year:'2026',pages:200,language:'Italiano',genres:['Narrativa'],description:'Dati di prova per verificare il passaggio automatico dalla fotocamera al modulo.'}}]:[],warnings:[]}));}
return new Response('{}',{status:404});};
await import('/src/main.tsx');
const diagnostics=setInterval(async()=>{const v=document.querySelector('video');if(!v||v.readyState<2)return;clearInterval(diagnostics);const {BrowserMultiFormatReader}=await import('@zxing/browser');const {DecodeHintType,BarcodeFormat}=await import('@zxing/library');const reader=new BrowserMultiFormatReader(new Map([[DecodeHintType.POSSIBLE_FORMATS,[BarcodeFormat.EAN_13]]]));for(const [name,source] of [['original',c],['video',v]]){const canvas=document.createElement('canvas');canvas.width=260;canvas.height=130;canvas.getContext('2d').drawImage(source,510,295,260,130,0,0,260,130);try{console.log('TEST DECODE',name,reader.decodeFromCanvas(canvas).getText());}catch(e){console.error('TEST DECODE',name,e);}}},300);

</script></body></html>
